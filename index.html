<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SchedKit</title>
  <link rel="stylesheet" href="ui/app.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="nav">
        <button class="icon-btn" id="prevBtn" title="上一页" aria-label="上一页">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8 10 12.5"/></svg>
        </button>
        <div class="period" id="periodLabel"></div>
        <button class="icon-btn" id="nextBtn" title="下一页" aria-label="下一页">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
        </button>
      </div>

      <div class="seg" id="viewSwitch" role="tablist">
        <button data-view="month" role="tab" aria-selected="false">月</button>
        <button data-view="week" role="tab" aria-selected="true">周</button>
        <button data-view="cal" role="tab" aria-selected="false">台历</button>
      </div>

      <button class="today-btn" id="todayBtn" title="回到今天" aria-label="回到今天">今</button>

      <div class="spacer"></div>

      <div class="search-wrap">
        <div class="search">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.2"/><path d="m10.2 10.2 3 3"/></svg>
          <input id="searchInput" type="text" placeholder="搜索日程" autocomplete="off">
        </div>
        <div class="search-results" id="searchResults" hidden></div>
      </div>

      <button class="pending-btn" id="pendingBtn" title="同步邮箱">
        同步<span class="badge" id="pendingCount" hidden></span>
      </button>

      <button class="icon-btn" id="addBtn" title="新建日程" aria-label="新建日程">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg>
      </button>

      <button class="icon-btn" id="settingsBtn" title="设置" aria-label="设置">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" stroke="none" d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z"/></svg>
      </button>
    </header>

    <div class="weekstrip" id="weekStrip"></div>

    <main class="board">
      <div class="week-grid" id="weekGrid"></div>
      <div class="month-grid" id="monthGrid" hidden></div>
      <div class="cal-page" id="calPage" hidden></div>
    </main>
  </div>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div class="drawer-type" id="drawerType"></div>
      <button class="icon-btn" id="drawerClose" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
      </button>
    </div>
    <div class="drawer-body">
      <h2 class="drawer-title" id="drawerTitle"></h2>
      <div class="drawer-sub" id="drawerSub"></div>
      <dl class="meta" id="drawerMeta"></dl>
      <div class="drawer-note" id="drawerNote" hidden></div>
      <div class="drawer-day" id="drawerDay" hidden></div>
    </div>
    <div class="drawer-actions" id="drawerActions">
      <button class="solid-btn" id="drawerEdit">编辑</button>
      <button class="ghost-btn" id="drawerCancel">标记取消</button>
      <button class="danger-btn" id="drawerDelete">删除</button>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <section class="sheet" id="settingsSheet" aria-hidden="true">
    <div class="sheet-head">
      <h2>设置</h2>
      <button class="icon-btn" id="settingsClose" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
      </button>
    </div>
    <div class="sheet-body">
      <div class="field">
        <div class="field-label">主题</div>
        <div class="theme-list" id="themeList"></div>
      </div>
      <div class="field">
        <div class="field-label">提醒</div>
        <div class="reminder-list" id="reminderList"></div>
        <div class="reminder-add">
          <select id="reminderKind" aria-label="提醒方式">
            <option value="minutes">提前</option>
            <option value="days">前一天</option>
          </select>
          <input id="reminderValue" type="number" min="0" step="1" value="15" aria-label="提前数量">
          <span class="reminder-unit" id="reminderUnit">分钟</span>
          <input id="reminderTime" type="time" value="18:00" aria-label="时刻" hidden>
          <button type="button" class="ghost-btn" id="reminderAdd">添加</button>
        </div>
        <div class="field-hint">可多选；时间点到了弹系统通知。</div>
      </div>
      <div class="field">
        <label class="toggle-row">
          <input type="checkbox" id="autostartToggle">
          <span>开机自动启动</span>
        </label>
        <div class="field-hint">登录 Windows 后在托盘静默运行。</div>
      </div>
      <div class="field">
        <div class="field-label">邮箱</div>
        <div class="setting-inputs">
          <input type="email" id="mailUser" placeholder="邮箱地址" autocomplete="off" spellcheck="false">
          <input type="password" id="mailCode" placeholder="IMAP 授权码" autocomplete="off">
        </div>
        <div class="field-hint">163 网页版开启 IMAP 后生成的授权码，不是登录密码。</div>
      </div>
      <div class="field">
        <div class="field-label">同步范围</div>
        <div class="setting-inputs">
          <select id="mailDays" aria-label="同步范围">
            <option value="7">最近一周</option>
            <option value="14">最近两周</option>
            <option value="30">最近一个月</option>
            <option value="last">上次同步之后</option>
          </select>
        </div>
        <div class="field-hint">只处理这段时间内收到的邮件；选「上次同步之后」只取新邮件，首次同步回看一周。</div>
      </div>
      <div class="field">
        <div class="field-label">模型</div>
        <div class="setting-inputs">
          <input type="text" id="aiBase" placeholder="接口地址" autocomplete="off" spellcheck="false">
          <input type="text" id="aiModel" placeholder="模型名" autocomplete="off" spellcheck="false">
          <input type="password" id="aiKey" placeholder="API Key" autocomplete="off">
        </div>
      </div>
      <div class="field">
        <div class="field-label">数据</div>
        <div class="field-hint" id="dataHint">本地演示数据，暂未接入邮箱。</div>
      </div>
    </div>
    <div class="sheet-foot">
      <button type="button" class="ghost-btn" id="settingsCancel">取消</button>
      <button type="button" class="solid-btn" id="settingsSave">保存</button>
    </div>
  </section>

  <section class="sheet sheet-wide" id="pendingSheet" aria-hidden="true">
    <div class="sheet-head">
      <h2>待确认</h2>
      <div class="sheet-head-actions">
        <button type="button" class="ghost-btn" id="syncBtn">同步邮箱</button>
        <button class="icon-btn" id="pendingClose" title="关闭" aria-label="关闭">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
        </button>
      </div>
    </div>
    <div class="sheet-body">
      <div class="pending-status" id="pendingStatus"></div>
      <div class="pending-toolbar" id="pendingToolbar" hidden>
        <button type="button" class="ghost-btn" id="pendingSkipAll">全部忽略</button>
        <button type="button" class="solid-btn" id="pendingAcceptAll">全部采纳</button>
      </div>
      <div class="pending-list" id="pendingList"></div>
    </div>
  </section>

  <section class="sheet sheet-wide" id="editorSheet" aria-hidden="true">
    <div class="sheet-head">
      <h2 id="editorTitle">新建日程</h2>
      <button class="icon-btn" id="editorClose" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
      </button>
    </div>
    <form class="sheet-body form" id="eventForm" novalidate>
      <div class="form-row">
        <label class="form-field">
          <span>类型</span>
          <select id="fType">
            <option value="interview">面试</option>
            <option value="written">笔试</option>
            <option value="assessment">测评</option>
            <option value="other">其他</option>
          </select>
        </label>
        <label class="form-field">
          <span>形式</span>
          <select id="fMode">
            <option value="线上">线上</option>
            <option value="线下">线下</option>
            <option value="">未定</option>
          </select>
        </label>
      </div>

      <label class="form-field">
        <span>公司</span>
        <input id="fCompany" type="text" maxlength="80" autocomplete="off">
      </label>

      <label class="form-field">
        <span>地点</span>
        <input id="fLocation" type="text" maxlength="120" autocomplete="off" placeholder="线下地点，线上留空">
      </label>

      <div class="form-row">
        <label class="form-field">
          <span>岗位</span>
          <input id="fPosition" type="text" maxlength="80" autocomplete="off">
        </label>
        <label class="form-field">
          <span>事项</span>
          <input id="fRound" type="text" maxlength="40" autocomplete="off" placeholder="如 AI 面试、线上笔试、在线测评">
        </label>
      </div>

      <div class="form-row">
        <label class="form-field">
          <span>日期</span>
          <input id="fDate" type="date">
        </label>
        <label class="form-field">
          <span>开始</span>
          <input id="fStart" type="time">
        </label>
        <label class="form-field">
          <span>结束</span>
          <input id="fEnd" type="time">
        </label>
      </div>

      <label class="form-field">
        <span>截止</span>
        <input id="fDeadline" type="datetime-local">
      </label>

      <label class="form-field">
        <span>链接</span>
        <input id="fLink" type="text" maxlength="500" autocomplete="off" placeholder="选填">
      </label>

      <label class="form-field">
        <span>备注</span>
        <textarea id="fNote" rows="3" maxlength="1000"></textarea>
      </label>

      <div class="form-error" id="formError" hidden></div>

      <div class="form-actions">
        <button type="button" class="ghost-btn" id="editorCancel">取消</button>
        <button type="submit" class="solid-btn">保存</button>
      </div>
    </form>
  </section>

  <script src="ui/themes.js"></script>
  <script src="ui/lunar.js"></script>
  <script src="ui/mock.js"></script>
  <script src="ui/app.js"></script>
</body>
</html>
